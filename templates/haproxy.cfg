global
    log         127.0.0.1 local2
    chroot      /var/lib/haproxy
    pidfile     /var/run/haproxy.pid
    maxconn     20000
    user        haproxy
    group       haproxy
    daemon

defaults
    mode                    tcp
    log                     global
    option                  tcplog
    option                  dontlognull
    retries                 3
    timeout connect         10s
    timeout client          1m
    timeout server          1m
    timeout check           10s
    # Keeps long-lived watches, oc logs -f and websockets open.
    timeout tunnel          1h

listen stats
    mode http
    bind 127.0.0.1:9000
    stats enable
    stats uri /

# ---------------------------------------------------------------------------
# LAN side: admins and LAN clients (LAN_IP) reach the API and the default ingress
# (web console, OAuth, application routes).
# ---------------------------------------------------------------------------
listen lan-api-6443
    bind ${LAN_IP}:6443
    option httpchk GET /readyz HTTP/1.0
    option log-health-checks
    balance roundrobin
    server master-0 ${MASTER_0_IP}:6443 verify none check check-ssl inter 10s fall 2 rise 3
    server master-1 ${MASTER_1_IP}:6443 verify none check check-ssl inter 10s fall 2 rise 3
    server master-2 ${MASTER_2_IP}:6443 verify none check check-ssl inter 10s fall 2 rise 3

listen lan-ingress-443
    bind ${LAN_IP}:443
    balance source
    server master-0 ${MASTER_0_IP}:443 check inter 1s
    server master-1 ${MASTER_1_IP}:443 check inter 1s
    server master-2 ${MASTER_2_IP}:443 check inter 1s

listen lan-ingress-80
    bind ${LAN_IP}:80
    balance source
    server master-0 ${MASTER_0_IP}:80 check inter 1s
    server master-1 ${MASTER_1_IP}:80 check inter 1s
    server master-2 ${MASTER_2_IP}:80 check inter 1s

# ---------------------------------------------------------------------------
# Business side: the cluster's own load balancer, for nodes and pods.
# api, api-int and *.apps resolve here inside the cluster.
# ---------------------------------------------------------------------------
listen cluster-api-6443
    bind ${BUSINESS_HOST_IP}:6443
    option httpchk GET /readyz HTTP/1.0
    option log-health-checks
    balance roundrobin
    server master-0 ${MASTER_0_IP}:6443 verify none check check-ssl inter 10s fall 2 rise 3
    server master-1 ${MASTER_1_IP}:6443 verify none check check-ssl inter 10s fall 2 rise 3
    server master-2 ${MASTER_2_IP}:6443 verify none check check-ssl inter 10s fall 2 rise 3

# Serves node ignition, which contains credentials: never offered to the LAN.
listen cluster-machine-config-server-22623
    bind ${BUSINESS_HOST_IP}:22623
    balance roundrobin
    server master-0 ${MASTER_0_IP}:22623 check inter 1s
    server master-1 ${MASTER_1_IP}:22623 check inter 1s
    server master-2 ${MASTER_2_IP}:22623 check inter 1s

# Routes used from inside the cluster (OAuth, console, ingress canary checks).
listen cluster-ingress-443
    bind ${BUSINESS_HOST_IP}:443
    balance source
    server master-0 ${MASTER_0_IP}:443 check inter 1s
    server master-1 ${MASTER_1_IP}:443 check inter 1s
    server master-2 ${MASTER_2_IP}:443 check inter 1s

listen cluster-ingress-80
    bind ${BUSINESS_HOST_IP}:80
    balance source
    server master-0 ${MASTER_0_IP}:80 check inter 1s
    server master-1 ${MASTER_1_IP}:80 check inter 1s
    server master-2 ${MASTER_2_IP}:80 check inter 1s
