# Ingress Node Firewall Operator, from the Red Hat catalog. Applied by
# scripts/96-ingress-node-firewall.sh, which first checks that the package exists.
apiVersion: v1
kind: Namespace
metadata:
  name: openshift-ingress-node-firewall
  labels:
    # The daemon loads eBPF/XDP programs on the nodes.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    # Platform namespace: exempt from templates/admin-network-policy.yaml.
    node-access/platform: "true"
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: ingress-node-firewall-operators
  namespace: openshift-ingress-node-firewall
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: ingress-node-firewall-sub
  namespace: openshift-ingress-node-firewall
spec:
  channel: stable
  name: ingress-node-firewall
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  installPlanApproval: Automatic
