# Business network: DNS and DHCP for the cluster nodes.
# Inside the cluster every name points to the host's business address, where HAProxy
# forwards to the masters' business addresses. Cluster traffic never uses management.
interface=${BUSINESS_BRIDGE}
except-interface=lo
bind-dynamic
user=dnsmasq
group=dnsmasq
log-dhcp

no-hosts
no-resolv
server=${UPSTREAM_DNS}

domain=${CLUSTER_DOMAIN}
local=/${CLUSTER_DOMAIN}/
host-record=api.${CLUSTER_DOMAIN},${BUSINESS_HOST_IP}
host-record=api-int.${CLUSTER_DOMAIN},${BUSINESS_HOST_IP}
address=/apps.${CLUSTER_DOMAIN}/${BUSINESS_HOST_IP}
host-record=master-0.${CLUSTER_DOMAIN},${MASTER_0_BUSINESS_IP}
host-record=master-1.${CLUSTER_DOMAIN},${MASTER_1_BUSINESS_IP}
host-record=master-2.${CLUSTER_DOMAIN},${MASTER_2_BUSINESS_IP}
host-record=infra-0.${CLUSTER_DOMAIN},${INFRA_0_BUSINESS_IP}

# Reservations only: an unknown MAC gets no lease. The default route and DNS come
# from here, which makes this NIC the node's primary one (node IP, br-ex).
dhcp-authoritative
dhcp-range=${BUSINESS_SUBNET}.0,static,255.255.255.0,12h
dhcp-option=option:router,${BUSINESS_HOST_IP}
dhcp-option=option:dns-server,${BUSINESS_HOST_IP}
dhcp-host=${MASTER_0_BUSINESS_MAC},${MASTER_0_BUSINESS_IP},master-0
dhcp-host=${MASTER_1_BUSINESS_MAC},${MASTER_1_BUSINESS_IP},master-1
dhcp-host=${MASTER_2_BUSINESS_MAC},${MASTER_2_BUSINESS_IP},master-2
dhcp-host=${INFRA_0_BUSINESS_MAC},${INFRA_0_BUSINESS_IP},infra-0
dhcp-leasefile=/var/lib/dnsmasq/ocp-business.leases
