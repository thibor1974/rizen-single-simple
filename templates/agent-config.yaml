          type: ethernet
          state: up
          mac-address: ${INFRA_0_MGMT_MAC}
          ipv4:
            enabled: true
            dhcp: false
            address:
              - ip: ${INFRA_0_MGMT_IP}
                prefix-length: 24
          ipv6:
            enabled: false
        - name: enp2s0
          type: ethernet
          state: up
          mac-address: ${INFRA_0_BUSINESS_MAC}
          ipv4:
            enabled: true
            dhcp: true
          ipv6:
            enabled: false
      routes:
        config:
          - destination: ${MGMT_CIDR}
            next-hop-interface: enp1s0
            table-id: ${MGMT_ROUTE_TABLE}
          - destination: 0.0.0.0/0
            next-hop-address: ${MGMT_HOST_IP}
            next-hop-interface: enp1s0
            table-id: ${MGMT_ROUTE_TABLE}
      route-rules:
        config:
          - ip-from: ${INFRA_0_MGMT_IP}/32
            route-table: ${MGMT_ROUTE_TABLE}
            priority: ${MGMT_RULE_PRIORITY}
