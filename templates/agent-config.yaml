apiVersion: v1beta1
kind: AgentConfig
metadata:
  name: ${CLUSTER_NAME}
rendezvousIP: ${MASTER_0_IP}
# Every node has one NIC, enp1s0, on the business network. Its address, default
# route and DNS come from a DHCP reservation on the host (templates/dnsmasq-business.conf).
# OpenShift bridges it into br-ex and uses it for everything.
hosts:
  - hostname: master-0
    role: master
    rootDeviceHints:
      deviceName: /dev/vda
    interfaces:
      - name: enp1s0
        macAddress: ${MASTER_0_MAC}
    networkConfig:
      interfaces:
        - name: enp1s0
          type: ethernet
          state: up
          mac-address: ${MASTER_0_MAC}
          ipv4:
            enabled: true
            dhcp: true
          ipv6:
            enabled: false
  - hostname: master-1
    role: master
    rootDeviceHints:
      deviceName: /dev/vda
    interfaces:
      - name: enp1s0
        macAddress: ${MASTER_1_MAC}
    networkConfig:
      interfaces:
        - name: enp1s0
          type: ethernet
          state: up
          mac-address: ${MASTER_1_MAC}
          ipv4:
            enabled: true
            dhcp: true
          ipv6:
            enabled: false
  - hostname: master-2
    role: master
    rootDeviceHints:
      deviceName: /dev/vda
    interfaces:
      - name: enp1s0
        macAddress: ${MASTER_2_MAC}
    networkConfig:
      interfaces:
        - name: enp1s0
          type: ethernet
          state: up
          mac-address: ${MASTER_2_MAC}
          ipv4:
            enabled: true
            dhcp: true
          ipv6:
            enabled: false
