# LAN side: answers only for the cluster domain, pointing at the host's LAN IP.
# Never serves DHCP, and never forwards, so it is not an open resolver.
interface=${LAN_IF}
except-interface=lo
no-dhcp-interface=${LAN_IF}
bind-dynamic
user=dnsmasq
group=dnsmasq

no-hosts
no-resolv

local=/${CLUSTER_DOMAIN}/
host-record=api.${CLUSTER_DOMAIN},${LAN_IP}
address=/apps.${CLUSTER_DOMAIN}/${LAN_IP}
