# Business network: DNS and DHCP for the cluster nodes.
# Inside the cluster every name points to the host's business address, where HAProxy
# forwards to the masters' business addresses. Cluster traffic never uses management.
interface=virbr-ocp-biz
except-interface=lo
bind-dynamic
user=dnsmasq
group=dnsmasq
log-dhcp

no-hosts
no-resolv
server=1.1.1.1

domain=ocp.lab.internal
local=/ocp.lab.internal/
host-record=api.ocp.lab.internal,192.168.127.1
host-record=api-int.ocp.lab.internal,192.168.127.1
address=/apps.ocp.lab.internal/192.168.127.1
host-record=master-0.ocp.lab.internal,192.168.127.10
host-record=master-1.ocp.lab.internal,192.168.127.11
host-record=master-2.ocp.lab.internal,192.168.127.12
host-record=infra-0.ocp.lab.internal,192.168.127.20

# Reservations only: an unknown MAC gets no lease. The default route and DNS come
# from here, which makes this NIC the node's primary one (node IP, br-ex).
dhcp-authoritative
dhcp-range=192.168.127.0,static,255.255.255.0,12h
dhcp-option=option:router,192.168.127.1
dhcp-option=option:dns-server,192.168.127.1
dhcp-host=52:54:00:12:6b:10,192.168.127.10,master-0
dhcp-host=52:54:00:12:6b:11,192.168.127.11,master-1
dhcp-host=52:54:00:12:6b:12,192.168.127.12,master-2
dhcp-host=52:54:00:12:6b:20,192.168.127.20,infra-0
dhcp-leasefile=/var/lib/dnsmasq/ocp-business.leases
