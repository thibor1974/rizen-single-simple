# Cluster-managed firewall on the business NIC: no SSH, API or default ingress from
# the business network. Applied by scripts/96-ingress-node-firewall.sh.
#
# The Ingress Node Firewall attaches an eBPF/XDP program to enp2s0, the physical port
# of br-ex, so it filters packets as they arrive, before OVS and netfilter. It
# complements the nftables MachineConfigs (templates/node-firewall.nft), which also
# protect the nodes during installation, before any operator exists.
#
# How the rules read:
# - Rules match source CIDR, protocol and destination port. They are stateless, so
#   they only ever look at destination ports: replies to the node's own outbound
#   connections arrive on ephemeral ports and are never matched.
# - For each packet the most specific sourceCIDRs entry applies. The nodes and the
#   host's internal load balancer get their own /32 entry, which allows every
#   management port. Everyone else falls into 0.0.0.0/0, where they are denied.
# - Rules cannot match a destination address. That is why infra-0 does not deny
#   80/443: MetalLB services on those ports arrive on the same NIC. infra-0 runs
#   neither the API nor the default ingress, so nothing of the management plane
#   answers there on 80/443.
apiVersion: ingressnodefirewall.openshift.io/v1alpha1
kind: IngressNodeFirewallConfig
metadata:
  name: ingressnodefirewallconfig
  namespace: openshift-ingress-node-firewall
spec:
  # Nodes that run the firewall daemon. The script labels all four.
  nodeSelector:
    ingress-node-firewall/enabled: "true"
---
apiVersion: ingressnodefirewall.openshift.io/v1alpha1
kind: IngressNodeFirewall
metadata:
  name: business-masters
spec:
  interfaces:
    - enp2s0
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/master: ""
  ingress:
    - sourceCIDRs:
        - 192.168.127.10/32
        - 192.168.127.11/32
        - 192.168.127.12/32
        - 192.168.127.20/32
        - 192.168.127.1/32
      rules:
        - order: 10
          protocolConfig: {protocol: TCP, tcp: {ports: 22}}
          action: Allow
        - order: 20
          protocolConfig: {protocol: TCP, tcp: {ports: 80}}
          action: Allow
        - order: 30
          protocolConfig: {protocol: TCP, tcp: {ports: 443}}
          action: Allow
        - order: 40
          protocolConfig: {protocol: TCP, tcp: {ports: 6443}}
          action: Allow
        - order: 50
          protocolConfig: {protocol: TCP, tcp: {ports: 22623}}
          action: Allow
    - sourceCIDRs:
        - 0.0.0.0/0
      rules:
        - order: 10
          protocolConfig: {protocol: TCP, tcp: {ports: 22}}
          action: Deny
        - order: 20
          protocolConfig: {protocol: TCP, tcp: {ports: 80}}
          action: Deny
        - order: 30
          protocolConfig: {protocol: TCP, tcp: {ports: 443}}
          action: Deny
        - order: 40
          protocolConfig: {protocol: TCP, tcp: {ports: 6443}}
          action: Deny
        - order: 50
          protocolConfig: {protocol: TCP, tcp: {ports: 22623}}
          action: Deny
---
apiVersion: ingressnodefirewall.openshift.io/v1alpha1
kind: IngressNodeFirewall
metadata:
  name: business-infra
spec:
  interfaces:
    - enp2s0
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/infra: ""
  ingress:
    - sourceCIDRs:
        - 192.168.127.10/32
        - 192.168.127.11/32
        - 192.168.127.12/32
        - 192.168.127.20/32
        - 192.168.127.1/32
      rules:
        - order: 10
          protocolConfig: {protocol: TCP, tcp: {ports: 22}}
          action: Allow
        - order: 20
          protocolConfig: {protocol: TCP, tcp: {ports: 6443}}
          action: Allow
        - order: 30
          protocolConfig: {protocol: TCP, tcp: {ports: 22623}}
          action: Allow
    - sourceCIDRs:
        - 0.0.0.0/0
      rules:
        - order: 10
          protocolConfig: {protocol: TCP, tcp: {ports: 22}}
          action: Deny
        - order: 20
          protocolConfig: {protocol: TCP, tcp: {ports: 6443}}
          action: Deny
        - order: 30
          protocolConfig: {protocol: TCP, tcp: {ports: 22623}}
          action: Deny
