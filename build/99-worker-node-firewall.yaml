# Rendered once per pool by scripts/05-render.sh from templates/node-firewall.nft and
# applied at install time. Loads the node firewall before the network comes up.
# sshd, the API server and the routers still listen on all addresses: the firewall
# decides who reaches them on which NIC, so a late DHCP lease can never leave a
# service unable to bind.
# Inspect: sudo nft list table inet node_filter
# Remove live (until the next reboot): sudo nft delete table inet node_filter
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-node-firewall
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - path: /etc/nftables/node-firewall.nft
          mode: 420
          overwrite: true
          contents:
            source: data:text/plain;charset=utf-8;base64,
    systemd:
      units:
        - name: node-firewall.service
          enabled: true
          contents: |
            [Unit]
            Description=Node firewall for the business (enp2s0/br-ex) and management (enp1s0) NICs
            Wants=network-pre.target
            Before=network-pre.target sshd.service

            [Service]
            Type=oneshot
            RemainAfterExit=yes
            ExecStart=/usr/sbin/nft -f /etc/nftables/node-firewall.nft
            ExecStop=/usr/sbin/nft delete table inet node_filter

            [Install]
            WantedBy=multi-user.target
