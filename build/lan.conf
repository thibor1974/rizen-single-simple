# LAN side: answers only for the cluster domain, pointing at the host's LAN IP.
# Never serves DHCP, and never forwards, so it is not an open resolver.
interface=enp3s0
except-interface=lo
no-dhcp-interface=enp3s0
bind-dynamic
user=dnsmasq
group=dnsmasq

no-hosts
no-resolv

local=/ocp.lab.internal/
host-record=api.ocp.lab.internal,192.168.1.68
address=/apps.ocp.lab.internal/192.168.1.68
