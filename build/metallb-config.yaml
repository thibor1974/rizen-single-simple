# Speakers run on the infra node only: it is the node dedicated to business ingress
# and egress, and it is tainted, so the speaker needs a toleration. The controller
# runs wherever the scheduler puts it.
apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: metallb-system
spec:
  nodeSelector:
    node-role.kubernetes.io/infra: ""
  speakerTolerations:
    - key: node-role.kubernetes.io/infra
      operator: Exists
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: business
  namespace: metallb-system
spec:
  addresses:
    - 192.168.127.100-192.168.127.149
---
# Announce only from the infra node and only on the business network. The business
# NIC is the node's primary one, so OVN-Kubernetes has bridged it into br-ex.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: business
  namespace: metallb-system
spec:
  ipAddressPools:
    - business
  nodeSelectors:
    - matchLabels:
        node-role.kubernetes.io/infra: ""
  interfaces:
    - br-ex
