# Speakers run on all three nodes, so any of them can announce a service address.
apiVersion: metallb.io/v1beta1
kind: MetalLB
metadata:
  name: metallb
  namespace: metallb-system
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: business
  namespace: metallb-system
spec:
  addresses:
    - 192.168.127.100-192.168.127.149
---
# Layer 2 announcements on br-ex, the bridge OVN-Kubernetes built on the business NIC.
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: business
  namespace: metallb-system
spec:
  ipAddressPools:
    - business
  interfaces:
    - br-ex
