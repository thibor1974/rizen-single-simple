# Cluster-wide guardrail against lateral movement from application pods to the nodes.
# Applied by scripts/95-post-install.sh.
#
# A pod's connection to a node address is delivered inside the node (through
# ovn-k8s-mp0 or from another node's address), so the node firewall cannot tell it
# apart from cluster traffic. This policy stops it at the pod's own port, in OVN.
#
# Subject: every namespace except those labelled node-access/platform=true. The
# post-install script puts that label on the OpenShift platform namespaces, which
# need node addresses (monitoring scrapes kubelets, the API servers reach etcd...).
# Project admins cannot label namespaces, so they cannot opt out.
#
# Rules are evaluated in order, first match wins:
# 1. Allow the API on the masters' business addresses: the kubernetes Service.
# 2. Deny the machine config server through the host's internal load balancer.
# 3. Deny everything else a node owns: business node addresses, EgressIP addresses
#    (hosted on infra-0) and the whole management network.
# MetalLB service IPs, routes and anything outside the cluster are unaffected.
# AdminNetworkPolicy outranks namespace NetworkPolicy, so no project can reopen this.
apiVersion: policy.networking.k8s.io/v1alpha1
kind: AdminNetworkPolicy
metadata:
  name: deny-pods-to-node-addresses
spec:
  priority: 10
  subject:
    namespaces:
      matchExpressions:
        - key: node-access/platform
          operator: DoesNotExist
  egress:
    - name: allow-kubernetes-api
      action: Allow
      to:
        - networks:
            - 192.168.127.10/32
            - 192.168.127.11/32
            - 192.168.127.12/32
      ports:
        - portNumber:
            protocol: TCP
            port: 6443
    - name: deny-machine-config-server
      action: Deny
      to:
        - networks:
            - 192.168.127.1/32
      ports:
        - portNumber:
            protocol: TCP
            port: 22623
    - name: deny-node-addresses
      action: Deny
      to:
        - networks:
            - 192.168.127.10/32
            - 192.168.127.11/32
            - 192.168.127.12/32
            - 192.168.127.20/32
            - 192.168.127.150/31
            - 192.168.127.152/29
            - 192.168.127.160/27
            - 192.168.127.192/29
            - 192.168.126.0/24
