{{- if .Values.egressIP.enabled }}
{{- if not .Values.egressIP.ips }}
{{- fail "egressIP.ips must list at least one address from the business EgressIP range" }}
{{- end }}
# Cluster-scoped: installing the chart needs rights on egressips.k8s.ovn.org.
apiVersion: k8s.ovn.org/v1
kind: EgressIP
metadata:
  name: {{ printf "%s-%s" .Release.Namespace (include "egress-toolbox.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "egress-toolbox.labels" . | nindent 4 }}
spec:
  egressIPs:
    {{- toYaml .Values.egressIP.ips | nindent 4 }}
  # Only this release's pods in this namespace; build pods keep the default egress.
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  podSelector:
    matchLabels:
      {{- include "egress-toolbox.selectorLabels" . | nindent 6 }}
{{- end }}
