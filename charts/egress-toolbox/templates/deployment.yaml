apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "egress-toolbox.fullname" . }}
  labels:
    {{- include "egress-toolbox.labels" . | nindent 4 }}
  {{- if .Values.build.enabled }}
  annotations:
    # Roll out again whenever a new build lands in the ImageStream.
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"{{ include "egress-toolbox.fullname" . }}:{{ .Values.image.tag }}"},"fieldPath":"spec.template.spec.containers[?(@.name==\"toolbox\")].image"}]
  {{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "egress-toolbox.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "egress-toolbox.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "egress-toolbox.fullname" . }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      # No UID set: OpenShift's restricted-v2 SCC assigns one from the namespace range.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: toolbox
          image: {{ include "egress-toolbox.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sleep", "infinity"]
          workingDir: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 5
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
