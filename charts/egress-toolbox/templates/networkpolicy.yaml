{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "egress-toolbox.fullname" . }}-egress
  labels:
    {{- include "egress-toolbox.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "egress-toolbox.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    # Everything not listed here is dropped, including ICMP (so ping fails) and UDP.
    - ports:
        {{- toYaml .Values.networkPolicy.ports | nindent 8 }}
      {{- with .Values.networkPolicy.cidrs }}
      to:
        {{- range . }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
      {{- end }}
    {{- if .Values.networkPolicy.allowDNS }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    {{- end }}
{{- end }}
