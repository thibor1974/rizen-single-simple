{{- if .Values.networkPolicy.defaultDeny }}
# Namespace-wide: every pod in {{ .Release.Namespace }} gets no ingress and no egress
# unless another NetworkPolicy allows it. `oc rsh`/`exec`/`logs` still work (they go
# through the kubelet, not the pod network).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "egress-toolbox.fullname" . }}-default-deny
  labels:
    {{- include "egress-toolbox.labels" . | nindent 4 }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
